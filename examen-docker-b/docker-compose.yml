# Examen Docker · Bloque B
# Añade tus servicios dentro de "services:" siguiendo el README.

networks:
  interna:
    driver: bridge

services:

  # ── No toques este servicio: es el corrector del examen ─────────────────────
  corrector:
    image: python:3.12-alpine
    profiles: ["corrector"]
    command: python /examen/corrector/corregir.py
    volumes:
      - ./:/examen:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - interna
  # ─────────────────────────────────────────────────────────────────────────────

  # Tus servicios van aquí debajo (al mismo nivel que "corrector"):

  proxy:
    image: nginx:alpine
    ports:
      - "${PUERTO_PROXY}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - interna
    depends_on:
      - web
      - quien
      - archivos

  web:
    image: httpd:2.4
    volumes:
      - ./compartida:/usr/local/apache2/htdocs:ro
    networks:
      - interna

  quien:
    image: traefik/whoami
    environment:
      - WHOAMI_NAME=alumno8
    networks:
      - interna

  archivos:
    image: filebrowser/filebrowser:v2.23.0
    volumes:
      - ./compartida:/srv
    networks:
      - interna
